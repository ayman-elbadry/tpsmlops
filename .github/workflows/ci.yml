# ci.yml — Workflow GitHub Actions pour l'intégration continue
# Déclenché à chaque push sur la branche 'main'.
# Installe les dépendances Python et effectue une vérification syntaxique.

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Installation de Python 3.11
      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installation des dépendances
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas duckdb dbt-core dbt-duckdb dagster

      # 4. Vérification syntaxique avec py_compile
      - name: Vérification syntaxique des scripts Python
        run: |
          python -m py_compile pipeline/ingest.py
          python -m py_compile pipeline/validate.py
          python -m py_compile pipeline/orchestrate.py

      # 5. Vérification de la configuration dbt
      - name: Vérification dbt (debug)
        run: |
          dbt debug --project-dir dbt_pipeline --profiles-dir dbt_pipeline
